<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Hubot+Sans:wght@400;600&display=swap');
    
    body {
      margin: 0;
      padding: 10px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: transparent;
      overflow: hidden;
    }

    .slider-container {
      position: relative;
      width: 100%;
      max-width: 600px;
      background: #EFF6F0;
      padding: 30px 60px;
      border-radius: 20px;
      box-sizing: border-box;
      text-align: center;
    }

    .slider-content {
      display: flex;
      width: 100%;
      align-items: center;
    }

    .slide {
      min-width: 100%;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      animation: fadeIn 0.5s;
    }

    .slide.active {
      display: flex;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .logo-empresa {
      height: 70px;
      width: auto;
      max-width: 250px;
      object-fit: contain;
      margin: 0 0 16px 0;
    }

    .estrellas {
      font-size: 1.5rem;
      color: #0F5C4A;
      margin: 0 0 4px 0;
      width: 100%;
    }

    .plataforma {
      font-family: 'Hubot Sans', sans-serif;
      font-weight: 400;
      font-size: 0.85rem;
      color: #C7D6C9;
      margin: 0 0 12px 0;
      letter-spacing: 0.5px;
      width: 100%;
    }

    .texto {
      font-family: 'Hubot Sans', sans-serif;
      font-weight: 400;
      font-size: 1.125rem;
      color: #1B1E1B;
      line-height: 1.5;
      margin: 0;
      width: 100%;
    }

    .btn-leer-mas, .btn-mostrar-menos {
      color: #0F5C4A;
      font-weight: 600;
      cursor: pointer;
      margin-left: 5px;
      transition: opacity 0.3s ease;
      white-space: nowrap;
    }

    .btn-leer-mas:hover, .btn-mostrar-menos:hover {
      opacity: 0.7;
    }

    .slider-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: #C7D6C9;
      border: none;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border-radius: 50%;
      transition: background 0.3s ease;
      padding: 0;
      z-index: 10;
    }

    .slider-btn:hover {
      background: #0F5C4A;
    }

    .slider-btn svg {
      width: 22px;
      height: 22px;
      stroke: #1B1E1B;
    }

    .prev-btn { left: 10px; }
    .next-btn { right: 10px; }

    @media (max-width: 600px) {
      .slider-container {
        padding: 20px 45px;
      }
      .logo-empresa {
        height: 55px;
      }
      .texto {
        font-size: 0.95rem;
      }
      .slider-btn {
        width: 34px;
        height: 34px;
      }
      .prev-btn { left: 5px; }
      .next-btn { right: 5px; }
    }
  </style>
</head>
<body>

<div class="slider-container" id="main-container">
  <button id="prevBtn" class="slider-btn prev-btn">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="15 18 9 12 15 6"></polyline>
    </svg>
  </button>
  
  <div class="slider-content" id="slides-wrapper">
    <div style="color: #1B1E1B; font-family: 'Hubot Sans', sans-serif; text-align: center; width: 100%;">Cargando reseñas...</div>
  </div>

  <button id="nextBtn" class="slider-btn next-btn">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="9 18 15 12 9 6"></polyline>
    </svg>
  </button>
</div>

<script>
  let currentSlide = 0;
  
  function avisarAltura() {
    const contenedor = document.getElementById('main-container');
    if(contenedor) {
      const altura = contenedor.offsetHeight + 20;
      window.parent.postMessage({ tipo: 'redimensionar', altura: altura }, '*');
    }
  }
  
  function showSlide(index) {
    const slides = document.querySelectorAll('.slide');
    if (slides.length === 0) return;
    if (index >= slides.length) currentSlide = 0;
    if (index < 0) currentSlide = slides.length - 1;
    
    slides.forEach(slide => slide.classList.remove('active'));
    slides[currentSlide].classList.add('active');
    
    setTimeout(avisarAltura, 50);
  }

  document.getElementById('prevBtn').addEventListener('click', () => {
    currentSlide -= 1;
    showSlide(currentSlide);
  });

  document.getElementById('nextBtn').addEventListener('click', () => {
    currentSlide += 1;
    showSlide(currentSlide);
  });

  document.getElementById('slides-wrapper').addEventListener('click', function(e) {
    if (e.target.classList.contains('btn-leer-mas')) {
      const contenedorTexto = e.target.closest('.texto');
      contenedorTexto.querySelector('.texto-visible').style.display = 'none';
      contenedorTexto.querySelector('.texto-oculto').style.display = 'inline';
      setTimeout(avisarAltura, 50);
    } else if (e.target.classList.contains('btn-mostrar-menos')) {
      const contenedorTexto = e.target.closest('.texto');
      contenedorTexto.querySelector('.texto-oculto').style.display = 'none';
      contenedorTexto.querySelector('.texto-visible').style.display = 'inline';
      setTimeout(avisarAltura, 50);
    }
  });

  async function cargarResenas() {
    const urlJSON = 'https://raw.githubusercontent.com/estelajimnezz/resenas-altibajo/refs/heads/main/resenas-altibajo.json?v=' + new Date().getTime();
    const contenedor = document.getElementById('slides-wrapper');
    
    try {
      const respuesta = await fetch(urlJSON);
      const resenas = await respuesta.json();
      
      contenedor.innerHTML = '';
      
      resenas.forEach((resena, index) => {
        let htmlTexto = '';
        const palabras = resena.texto.split(' ');
        
        if (palabras.length > 30) {
          const textoCorto = palabras.slice(0, 30).join(' ') + '...';
          htmlTexto = '<span class="texto-visible">' + textoCorto + ' <span class="btn-leer-mas">Leer más</span></span>' +
                      '<span class="texto-oculto" style="display:none;">' + resena.texto + ' <span class="btn-mostrar-menos">Mostrar menos</span></span>';
        } else {
          htmlTexto = resena.texto;
        }

        const slide = document.createElement('div');
        slide.className = index === 0 ? 'slide active' : 'slide';
        
        slide.innerHTML = '<img src="' + resena.logo + '" class="logo-empresa" alt="Logo de la empresa">' +
                          '<div class="estrellas">' + resena.estrellas + '</div>' +
                          '<div class="plataforma">' + resena.plataforma + '</div>' +
                          '<div class="texto">' + htmlTexto + '</div>';
        
        contenedor.appendChild(slide);
      });
      
      currentSlide = 0;
      setTimeout(avisarAltura, 100);
      
    } catch (error) {
      contenedor.innerHTML = '<div style="color: #1B1E1B; font-family: Hubot Sans, sans-serif; width: 100%; text-align: center;">Error al cargar.</div>';
      setTimeout(avisarAltura, 100);
    }
  }

  cargarResenas();
  window.addEventListener('resize', avisarAltura);
</script>
</body>
</html>
